[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.26"
src = "src"
via_ir = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
sepolia = "https://rpc.sepolia.org" # ETH Sepolia

[etherscan]
base_sepolia = { key = "EM9UGAE2GGXC9UDWTC8PI19IAM6SFH42E6" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }